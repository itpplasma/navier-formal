# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Preparation draft; every field is re-checked at Palomar preflight.
version: "v0.4"

project:
  name: "Navier–Stokes critical-norm reduction on R3 (checkpoint CP1)"
  description: >-
    Lean 4 / Mathlib formalization of the checkpoint block of a research
    programme on the three-dimensional incompressible Navier–Stokes Cauchy
    problem: the energy identity, critical scaling, cubic enstrophy inequality,
    exact signed critical pressure balance, low-frequency pressure bound, cubic
    gradient-quotient functional, and the conditional theorem that a
    finite-horizon a priori L3 bound implies Clay alternative A. The
    arbitrary-data critical bound itself is an explicit hypothesis. No solution
    of the Millennium problem is claimed.
  authors:
    - "Christopher Albert"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Christopher Albert"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35Q30", "76D05", "76D03", "35B65"]

sources:
  - title: "Internal CP1 proof development for the Navier–Stokes critical-norm route"
    authors:
      - "Christopher Albert"
    type: "other"
    relationship: "other"
    note: >-
      The private navier-paper manuscript, the research dossier, and this Lean
      development are records of the same ongoing internal research project.
      The manuscript is not a separately published or presented prior source
      being formalized. Its dated chronology is retained for provenance and
      statement review. No priority claim is made.
    license: "unknown"
  - title: "Existence and smoothness of the Navier–Stokes equation"
    authors:
      - "Charles L. Fefferman"
    id: "https://www.claymath.org/library/monographs/MPPc.pdf"
    type: "book"
    relationship: "background"
    note: "Official Clay problem statement; alternative A is the target of the conditional theorem."
  - title: "Localisation and compactness properties of the Navier–Stokes global regularity problem"
    authors:
      - "Terence Tao"
    id: "10.2140/apde.2013.6.25"
    type: "paper"
    relationship: "background"
    note: "Theorem 5.4 supplies the local classical theory; a Phase I literature axiom until proved from Mathlib."
  - title: "A profile decomposition approach to the L∞_t(L³_x) Navier–Stokes regularity criterion"
    authors:
      - "Isabelle Gallagher"
      - "Gabriel S. Koch"
      - "Fabrice Planchon"
    id: "arXiv:1012.0145"
    type: "paper"
    relationship: "background"
    note: "Theorem 4 records the Escauriaza–Seregin–Šverák endpoint in maximal L³ form; a Phase I literature axiom until proved from Mathlib."
  - title: "L_{3,∞}-solutions of the Navier–Stokes equations and backward uniqueness"
    authors:
      - "Luis Escauriaza"
      - "Gregory Seregin"
      - "Vladimír Šverák"
    id: "10.1070/RM2003v058n02ABEH000609"
    type: "paper"
    relationship: "background"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Millenium/NavierStokes.lean"
    relationship: "builds-on"
    note: "Reference statements of Fefferman's alternatives; alternative (A) is inlined in NavierFormal/ClayReference.lean with the Apache-2.0 header."
  - id: "https://github.com/openai/NavierStokesAndEuler"
    relationship: "builds-on"
    note: "Solution-only pinned dependency at commit 8937a8f4 (forced alternatives C/D, Apache-2.0); only NavierFormal/External/ imports it."

status:
  scope: >-
    Partial. The advertised statement surface is written and proved: nine CP1
    statements are declared with Mathlib-only definitions in Challenge.lean and
    re-declared and proved in Solution.lean, with type identity checked
    mechanically at pp.all. They are the Phase II complete results only: the
    norm-scaling half of prop:scaling including critical L3 invariance, the two
    scalar remarks of its proof, and prop:ode. Everything else in CP1 remains
    paper only and is deliberately not advertised; see the CP1 stage gates and
    the Phase II programme in itpplasma/navier PLAN.md.
  sorry_count: 9
  sorry_note: >-
    All nine are the intended statement-only sorries in Challenge.lean, which
    is the advertised surface. Solution.lean has none, and no other file in the
    repository has any.
  sorry_in_definitions: 0
  axioms: []

