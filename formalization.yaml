      framework: "Claude Code"
      tool_setup: "Claude Code workflows with parallel subagents; Lean checked locally with lake; controller integrates and audits"
      cost:
        wall_time: "not yet tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Workers receive frozen statements and disjoint files; reviewers run on a different tier or lens than authors."
  spend_usd: "subscription-based"
  notes: >-
    Human controller directs the programme and owns integration and promotion;
    Claude models draft proofs, Lean modules, and independent audits.

fidelity:
