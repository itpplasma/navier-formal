# formalization.yaml v0.4. Private draft; every field is re-checked at Palomar preflight.
version: "v0.4"

project:
  name: "Navier–Stokes critical-norm reduction on R3 (checkpoint CP1)"
  description: >-
    Lean 4 / Mathlib formalization of the checkpoint block of a private
    research programme on the three-dimensional incompressible Navier–Stokes
    Cauchy problem: the energy identity, critical scaling, cubic enstrophy
    inequality, exact signed critical pressure balance, low-frequency pressure
    bound, cubic gradient-quotient functional, and the conditional theorem that
    a finite-horizon a priori L3 bound implies Clay alternative A. The
    arbitrary-data critical bound itself is an explicit hypothesis. No solution
    of the Millennium problem is claimed.
  authors:
    - "Christopher Albert"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Christopher Albert"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35Q30", "76D05", "76D03", "35B65"]

sources:
  - title: "A conditional critical-norm route for the three-dimensional Navier–Stokes Cauchy problem (private manuscript, itpplasma/navier-paper)"
    authors:
      - "Christopher Albert"
    type: "manuscript"
    relationship: "formalizes"
    note: "Private unpublished manuscript; the formalization follows its statements and proofs."
    license: "unknown"
  - title: "Existence and smoothness of the Navier–Stokes equation"
    authors:
